{% extends "base.html" %}
{% block title %}Problem{% endblock %}
{% block content %}
<div class="card p-8 max-w-lg mx-auto text-center">
  <span class="inline-grid place-items-center h-11 w-11 rounded-full bg-amber-100 dark:bg-amber-900/40 text-amber-700 dark:text-amber-300 mb-3"><i data-lucide="triangle-alert" class="h-5 w-5"></i></span>
  <h1 class="text-lg font-semibold">Something needs attention</h1>
  <p class="muted text-sm mt-2">{{ message }}</p>
  <a href="/" class="btn-outline mt-6">Back to requests</a>
</div>
{% endblock %}
