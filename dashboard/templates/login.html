{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="min-h-[70vh] grid place-items-center">
  <div class="w-full max-w-sm">
    <div class="text-center mb-6">
      <span class="inline-grid place-items-center h-11 w-11 rounded-card bg-accent-600 text-white mb-3"><i data-lucide="package" class="h-6 w-6"></i></span>
      <h1 class="text-xl font-semibold tracking-tight">Sign in to BoxSource</h1>
      <p class="muted text-sm mt-1">Approvers can send RFQs and POs. Viewers are read-only.</p>
    </div>
    <form method="post" action="/login" class="card p-6 space-y-4">
      <input type="hidden" name="next" value="{{ next }}">
      {% if error %}
      <p role="alert" class="flex items-center gap-2 rounded-ctl bg-rose-50 dark:bg-rose-950/50 text-rose-700 dark:text-rose-300 text-sm px-3 py-2">
        <i data-lucide="circle-alert" class="h-4 w-4"></i>{{ error }}
      </p>
      {% endif %}
      <div>
        <label for="email" class="label">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required autofocus class="input">
      </div>
      <div>
        <label for="password" class="label">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required class="input">
      </div>
      <button class="btn-primary w-full">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
