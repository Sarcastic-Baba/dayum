# BoxSource engine config — reloaded at the start of every worker cycle.
# Every rule, threshold and rate lives here so a live change is a config edit, not code.

min_record_date: 2026-09-01
max_candidates: 10
search_areas: [Gurgaon, Manesar, Faridabad, Noida, Bawal]
manufacturer_min_signals: 2
accept_custom_size_statement: true
road_factor: 1.3
transport_inr_per_km_per_load: 0      # fill from client records; shown as an estimate
boxes_per_load: 0                     # fill from client records
gst_rate_percent: null                # client-supplied; needed to compare GST-inclusive quotes
trial_order_fraction: 0.1
approval_required: [send_rfq, send_po]
quote_wait_s: 600                     # after this, rank whatever quotes have arrived

limits:
  cost_inr_per_request: 25
  time_s_per_request: 400

pricing:                              # INR per unit for the cost ledger — fill with real rates
  llm_input_per_1k_tokens: 0.0
  llm_output_per_1k_tokens: 0.0
  grounded_search_per_call: 0.0
  crustdata_per_call: 0.0
  web_search_per_call: 0.0

storage:
  backend: sqlite                     # sqlite (local runs, tests) | supabase (with the dashboard)
  sqlite_path: data/boxsource.db

email:
  transport: file                     # file (local .eml) | smtp (team test inbox, for the demo)
  outbox_dir: data/outbox
  inbox_dir: data/inbox
  from: "BoxSource <boxsource@example.invalid>"
  test_recipient: "rfq-test@example.invalid"   # team-controlled inbox; never a real supplier
  sent_folder: '"[Gmail]/Sent Mail"'
  inbox_folder: INBOX
  reply_lookback_days: 3

sources:
  discovery: gemini                   # gemini (grounded search) | crustdata
  llm: gemini

voice:                                # Vapi phone intake (voice_server.py, VOICE_DEMO.md)
  timeout_s: 8                        # per tool call; on timeout the caller hears a fallback line
  llm_timeout_s: 6.5                  # both models are asked at once; first valid answer wins
  # Measured 22 Nov: flash-lite models extract in ~1.2 s; gemini-3.5-flash takes 8–22 s
  # (heavy thinking) — too slow for a phone call, so it is not used here.
  models: [gemini-flash-lite-latest, gemini-3.1-flash-lite]
  required:                           # the product's follow-up questions, asked in this order
    - {field: item, ask: "What item would you like to source?"}
    - {field: quantity_per_month, ask: "How many do you need per month?"}
    - {field: delivery_location, ask: "Where should they be delivered?"}
    - {field: ply, ask: "How many ply should the boxes be? For example 3, 5 or 7 ply."}
    - {field: size_in, ask: "What size do you need? Length by width by height, in inches."}
  registered: "Your request is registered. Our sourcing agent takes it from here, and you can follow it on the BoxSource dashboard."
  already_registered: "Your request is already registered, and our sourcing agent is working on it. You can follow it on the BoxSource dashboard."
  redirect: "I can only help you register a new sourcing request. You can follow progress, quotes and approvals on the BoxSource dashboard."
  log_path: data/voice.log

log_path: data/run.log
output_fields: [request_id, status, summary, candidates, recommendation, actions, cost_inr, duration_s]
